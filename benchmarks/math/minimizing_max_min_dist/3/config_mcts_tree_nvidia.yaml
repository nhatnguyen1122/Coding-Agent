language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
prompt:
  system_message: "SETTING:\nYou are an expert computational geometer and optimization specialist focusing on 3D point dispersion problems.\nYour task is to evolve a constructor function that generates an optimal arrangement of exactly 14 points in 3D space, maximizing the ratio of minimum distance to maximum distance between all point pairs.\n\nPROBLEM CONTEXT:\n- Target: Beat the current state-of-the-art benchmark of min/max ratio = 1/\u221A4.165849767 \u2248 0.4898\n- Constraint: Points must be placed in 3D Euclidean space (typically normalized to unit cube [0,1]\xB3 or unit sphere)\n- Mathematical formulation: For points Pi = (xi, yi, zi), i = 1,...,14:\n  * Distance matrix: dij = \u221A[(xi-xj)\xB2 + (yi-yj)\xB2 + (zi-zj)\xB2] for all i\u2260j\n  * Minimum distance: dmin = min{dij : i\u2260j}\n  * Maximum distance: dmax = max{dij : i\u2260j}\n  * Objective: maximize dmin/dmax subject to spatial constraints\n\nPERFORMANCE METRICS:\n1. **min_max_ratio**: dmin/dmax ratio (PRIMARY OBJECTIVE\
    \ - maximize)\n2. **combined_score**: min_max_ratio / 0.4898 (progress toward beating AlphaEvolve benchmark)\n3. **eval_time**: Execution time in seconds (balance accuracy vs. efficiency)\n\nTECHNICAL REQUIREMENTS:\n- **Reproducibility**: Fixed random seeds for all stochastic components\n"
evaluator:
  timeout: 360
  max_retries: 3
  cascade_evaluation: false
llm:
  api_base: https://integrate.api.nvidia.com/v1
  api_key: ${NVIDIA_API_KEY}
  models:
  - name: openai/gpt-oss-120b
    api_base: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    weight: 1.0
  evaluator_models:
  - name: openai/gpt-oss-120b
    api_base: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    weight: 1.0
  guide_models:
  - name: openai/gpt-oss-120b
    api_base: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    weight: 1.0
  temperature: 0.2
  max_tokens: 4096
  timeout: 600
  retries: 3
  retry_delay: 5
  max_total_tokens: 5000000
search:
  type: island_mcts
  num_context_programs: 4
  database:
    population_manager: mcts_tree
    population_size: 100
    num_islands: 4
    decay: 0.9
    intensity_min: 0.15
    intensity_max: 0.5
    use_adaptive_search: true
    use_ucb_selection: true
    use_migration: true
    use_unified_archive: false
    fixed_intensity: 0.4
    migration_interval: 10
    migration_count: 5
    local_context_program_ratio: 0.6
    archive_size: 50
    diversity_strategy: code
    use_dynamic_islands: true
    max_islands: 5
    spawn_productivity_threshold: 0.015
    spawn_cooldown_iterations: 30
    use_paradigm_breakthrough: true
    paradigm_window_size: 10
    paradigm_improvement_threshold: 0.12
    paradigm_max_uses: 2
    paradigm_num_to_generate: 3
    paradigm_max_tried: 10
    enable_error_retry: true
    max_error_retries: 2
    fitness_key: combined_score
    mcts_exploration_constant: 0.7
    mcts_qd_weight: 0.5
    mcts_max_tree_depth: 15
    mcts_backup: mixed
    mcts_backup_alpha: 0.5
    mcts_widening_alpha: 0.5
    mcts_w_quality: 0.35
    mcts_w_delta: 0.25
    mcts_w_novelty: 0.2
    mcts_w_invalid: 0.2
