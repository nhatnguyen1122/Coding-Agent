# OpenEvolve normal circle-packing run with Adaptive Multi-Tree MCTS
# plus prompt-only parent-child reflection memory.
# Use this with benchmarks/math/circle_packing/evaluator.py.
language: python
diff_based_generation: false
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 50000
log_level: INFO
random_seed: 42
log_all_llm_prompts: true
llm_prompt_log_file: llm_prompts.jsonl

llm:
  api_base: "https://integrate.api.nvidia.com/v1"
  api_key: ${NVIDIA_API_KEY}
  models:
    - name: "openai/gpt-oss-120b"
      api_base: "https://integrate.api.nvidia.com/v1"
      api_key: ${NVIDIA_API_KEY}
      weight: 1.0
  evaluator_models:
    - name: "openai/gpt-oss-120b"
      api_base: "https://integrate.api.nvidia.com/v1"
      api_key: ${NVIDIA_API_KEY}
      weight: 1.0
  guide_models:
    - name: "openai/gpt-oss-120b"
      api_base: "https://integrate.api.nvidia.com/v1"
      api_key: ${NVIDIA_API_KEY}
      weight: 1.0
  temperature: 0.2
  max_tokens: 4096
  timeout: 600
  retries: 3
  retry_delay: 5
  max_total_tokens: 5000000

search:
  type: island_mcts
  num_context_programs: 4
  database:
    population_manager: mcts_tree
    population_size: 60
    num_islands: 4
    decay: 0.9
    intensity_min: 0.15
    intensity_max: 0.5
    use_adaptive_search: true
    use_ucb_selection: true
    use_migration: true
    use_unified_archive: false
    fixed_intensity: 0.4
    migration_interval: 10
    migration_count: 5
    local_context_program_ratio: 0.6
    archive_size: 25
    diversity_strategy: code
    use_dynamic_islands: true
    max_islands: 5
    spawn_productivity_threshold: 0.015
    spawn_cooldown_iterations: 30
    use_paradigm_breakthrough: true
    paradigm_window_size: 10
    paradigm_improvement_threshold: 0.12
    paradigm_max_uses: 2
    paradigm_num_to_generate: 3
    paradigm_max_tried: 10
    enable_error_retry: true
    max_error_retries: 2
    fitness_key: combined_score
    mcts_exploration_constant: 0.7
    mcts_qd_weight: 0.5
    mcts_max_tree_depth: 15
    mcts_backup: mixed
    mcts_backup_alpha: 0.5
    mcts_widening_alpha: 0.5
    mcts_w_quality: 0.35
    mcts_w_delta: 0.25
    mcts_w_novelty: 0.2
    mcts_w_invalid: 0.2

prompt:
  system_message: |
    You are an expert mathematician specializing in circle packing problems and computational geometry. Your task is to improve a constructor function that directly produces a specific arrangement of 26 circles in a unit square, maximizing the sum of their radii.

    Key insights:
    - Circle packings often follow hexagonal patterns in the densest regions
    - Edge effects make square container packing harder than infinite packing
    - Circles can be placed in layers or shells when confined to a square

evaluator:
  timeout: 60
  max_retries: 3
  cascade_evaluation: true
  cascade_thresholds:
    - 0.5
    - 0.75

reflection:
  enabled: true
  reflect_on_success: true
  reflect_on_failure: true
  reflect_on_neutral: false
  model_role: guide_models
  max_tokens: 1024
  max_context_chars: 12000
  max_prompt_chars: 2500
  parent_reflection_in_prompt: true
  global_reflection_in_prompt: true
  max_positive_memories: 6
  negative_memory_in_prompt: true
  max_negative_memories: 8
  log_reflection_prompts: true

monitor:
  enabled: false
