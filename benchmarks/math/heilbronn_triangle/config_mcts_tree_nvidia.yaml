language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
prompt:
  system_message: 'SETTING:

    You are an expert computational geometer and optimization specialist with deep expertise in the Heilbronn triangle problem - a classical problem in discrete geometry that asks for the optimal placement of n points to maximize the minimum triangle area formed by any three points.


    PROBLEM SPECIFICATION:

    Your task is to design and implement a constructor function that generates an optimal arrangement of exactly 11 points within or on the boundary of an equilateral triangle with vertices at (0,0), (1,0), and (0.5, sqrt(3)/2).


    PERFORMANCE METRICS:

    1. **min_area_normalized**: Area of the smallest triangle among all point triplets (PRIMARY OBJECTIVE - maximize)

    2. **combined_score**: min_area_normalized / 0.036529889880030156 (BENCHMARK COMPARISON - maximize above 1.0)

    3. **eval_time**: Function execution time in seconds (EFFICIENCY - minimize, but secondary to quality)


    TECHNICAL REQUIREMENTS:

    - **Determinism**: Use fixed random seeds if employing stochastic methods for reproducibility

    - **Error handling**: Graceful handling of optimization failures or infeasible configurations

    '
evaluator:
  timeout: 360
  max_retries: 3
llm:
  api_base: https://integrate.api.nvidia.com/v1
  api_key: ${NVIDIA_API_KEY}
  models:
  - name: openai/gpt-oss-120b
    api_base: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    weight: 1.0
  evaluator_models:
  - name: openai/gpt-oss-120b
    api_base: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    weight: 1.0
  guide_models:
  - name: openai/gpt-oss-120b
    api_base: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    weight: 1.0
  temperature: 0.2
  max_tokens: 4096
  timeout: 600
  retries: 3
  retry_delay: 5
  max_total_tokens: 5000000
search:
  type: island_mcts
  num_context_programs: 4
  database:
    population_manager: mcts_tree
    population_size: 100
    num_islands: 4
    decay: 0.9
    intensity_min: 0.15
    intensity_max: 0.5
    use_adaptive_search: true
    use_ucb_selection: true
    use_migration: true
    use_unified_archive: false
    fixed_intensity: 0.4
    migration_interval: 10
    migration_count: 5
    local_context_program_ratio: 0.6
    archive_size: 50
    diversity_strategy: code
    use_dynamic_islands: true
    max_islands: 5
    spawn_productivity_threshold: 0.015
    spawn_cooldown_iterations: 30
    use_paradigm_breakthrough: true
    paradigm_window_size: 10
    paradigm_improvement_threshold: 0.12
    paradigm_max_uses: 2
    paradigm_num_to_generate: 3
    paradigm_max_tried: 10
    enable_error_retry: true
    max_error_retries: 2
    fitness_key: combined_score
    mcts_exploration_constant: 0.7
    mcts_qd_weight: 0.5
    mcts_max_tree_depth: 15
    mcts_backup: mixed
    mcts_backup_alpha: 0.5
    mcts_widening_alpha: 0.5
    mcts_w_quality: 0.35
    mcts_w_delta: 0.25
    mcts_w_novelty: 0.2
    mcts_w_invalid: 0.2
